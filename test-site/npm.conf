# Local fixture managed in source, separate from UI-managed Proxy Hosts.
# Do not also create an NPM Proxy Host with this hostname.
server {
    listen 80;
    server_name waf-test.localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $test_origin test-site:8080;
        proxy_pass http://$test_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
        add_header X-Test-Proxy nginx-proxy-manager always;
    }
}
