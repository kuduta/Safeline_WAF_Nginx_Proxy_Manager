# Linux Docker Engine, amd64. Tengine uses host networking as in upstream.
x-default-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

networks:
  safeline-database:
    driver: bridge
    internal: true
  npm-backend:
    driver: bridge
  npm-database:
    driver: bridge
    internal: true
  safeline-ce:
    driver: bridge
    ipam:
      driver: default
      config:
        - gateway: ${SUBNET_PREFIX:?SUBNET_PREFIX required}.1
          subnet: ${SUBNET_PREFIX}.0/24
    driver_opts:
      com.docker.network.bridge.name: safeline-ce

services:
  postgres:
    container_name: safeline-pg
    restart: unless-stopped
    logging: *default-logging
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE required}
    volumes:
      - ${SAFELINE_DIR}/resources/postgres/data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - POSTGRES_USER=safeline-ce
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?postgres password required}
    networks:
      safeline-database:
        aliases:
          - safeline-pg
    command: [postgres, -c, max_connections=600]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U safeline-ce -d safeline-ce
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  mgt:
    container_name: safeline-mgt
    restart: unless-stopped
    logging: *default-logging
    image: ${IMAGE_PREFIX}/safeline-mgt${REGION}${ARCH_SUFFIX}:${IMAGE_TAG:?image tag required}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SAFELINE_DIR}/resources/mgt:/app/data
      - ${SAFELINE_DIR}/logs/nginx:/app/log/nginx:z
      - ${SAFELINE_DIR}/resources/sock:/app/sock
      - ${SAFELINE_DIR}/resources/run:/app/run
    ports:
      - ${ADMIN_BIND_IP:-127.0.0.1}:${MGT_PORT:-9443}:1443
    healthcheck:
      test: curl -k -f https://localhost:1443/api/open/health
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    environment:
      - MGT_PG=postgres://safeline-ce:${POSTGRES_PASSWORD}@safeline-pg/safeline-ce?sslmode=disable
      - MGT_PROXY=${MGT_PROXY}
      - SUBNET_PREFIX=${SUBNET_PREFIX:?SUBNET_PREFIX required}
      - MGT_INTERNAL_TOKEN=${MGT_INTERNAL_TOKEN:-}
      - DETECTOR_AES_KEY=${DETECTOR_AES_KEY:-}
      - RIVER_SELFCHECK=${RIVER_SELFCHECK:-audit}
      - RIVER_CN_CAPABILITY_GATE=${RIVER_CN_CAPABILITY_GATE:-off}
      - RIVER_HEARTBEAT_EVIDENCE=${RIVER_HEARTBEAT_EVIDENCE:-off}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    depends_on:
      postgres:
        condition: service_healthy
      fvm:
        condition: service_started
      chaos:
        condition: service_started
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.4
      safeline-database: {}
  detect:
    container_name: safeline-detector
    restart: unless-stopped
    logging: *default-logging
    image: ${IMAGE_PREFIX}/safeline-detector${REGION}${ARCH_SUFFIX}:${IMAGE_TAG}
    volumes:
      - ${SAFELINE_DIR}/resources/detector:/resources/detector
      - ${SAFELINE_DIR}/logs/detector:/logs/detector
      - /etc/localtime:/etc/localtime:ro
    environment:
      - LOG_DIR=/logs/detector
      - DETECTOR_AES_KEY=${DETECTOR_AES_KEY:-}
      - DETECTOR_MGMT_TOKEN=${DETECTOR_MGMT_TOKEN:-}
      - DETECTOR_MGMT_AUTH=${DETECTOR_MGMT_AUTH:-on}
      - DETECTOR_UPDATE_VERIFY=${DETECTOR_UPDATE_VERIFY:-on}
      - DETECTOR_UPDATE_PUBLIC_KEY=${DETECTOR_UPDATE_PUBLIC_KEY:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.5
  tengine:
    container_name: safeline-tengine
    restart: unless-stopped
    logging: *default-logging
    image: ${IMAGE_PREFIX}/safeline-tengine${REGION}${ARCH_SUFFIX}:${IMAGE_TAG}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/resolv.conf:/etc/resolv.conf:ro
      - ${SAFELINE_DIR}/resources/nginx:/etc/nginx
      - ${SAFELINE_DIR}/resources/detector:/resources/detector
      - ${SAFELINE_DIR}/resources/chaos:/resources/chaos
      - ${SAFELINE_DIR}/logs/nginx:/var/log/nginx:z
      - ${SAFELINE_DIR}/resources/cache:/usr/local/nginx/cache
      - ${SAFELINE_DIR}/resources/sock:/app/sock
    environment:
      - TCD_MGT_API=https://${SUBNET_PREFIX}.4:1443/api/open/publish/server
      - TCD_SNSERVER=${SUBNET_PREFIX}.5:8000
      # deprecated
      - SNSERVER_ADDR=${SUBNET_PREFIX}.5:8000
      - CHAOS_ADDR=${SUBNET_PREFIX}.10
      - TCD_MGT_TOKEN=${MGT_INTERNAL_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile: 131072
    depends_on:
      mgt:
        condition: service_healthy
      detect:
        condition: service_started
    network_mode: host
  luigi:
    container_name: safeline-luigi
    restart: unless-stopped
    logging: *default-logging
    image: ${IMAGE_PREFIX}/safeline-luigi${REGION}${ARCH_SUFFIX}:${IMAGE_TAG}
    environment:
      - MGT_IP=${SUBNET_PREFIX}.4
      - LUIGI_PG=postgres://safeline-ce:${POSTGRES_PASSWORD}@safeline-pg/safeline-ce?sslmode=disable
      - DETECTOR_MGMT_TOKEN=${DETECTOR_MGMT_TOKEN:-}
      - ENTITLEMENT_CONSUMER_VERIFY=${ENTITLEMENT_CONSUMER_VERIFY:-off}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SAFELINE_DIR}/resources/luigi:/app/data
    depends_on:
      detect:
        condition: service_started
      mgt:
        condition: service_healthy
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.7
      safeline-database: {}
  fvm:
    container_name: safeline-fvm
    restart: unless-stopped
    logging: *default-logging
    image: ${IMAGE_PREFIX}/safeline-fvm${REGION}${ARCH_SUFFIX}:${IMAGE_TAG}
    environment:
      - DETECTOR_MGMT_TOKEN=${DETECTOR_MGMT_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.8
  chaos:
    depends_on:
      postgres:
        condition: service_healthy
    container_name: safeline-chaos
    restart: unless-stopped
    logging: *default-logging
    image: ${IMAGE_PREFIX}/safeline-chaos${REGION}${ARCH_SUFFIX}:${IMAGE_TAG}
    environment:
      - DB_ADDR=postgres://safeline-ce:${POSTGRES_PASSWORD}@safeline-pg/safeline-ce?sslmode=disable
      - ENTITLEMENT_CONSUMER_VERIFY=${ENTITLEMENT_CONSUMER_VERIFY:-off}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    volumes:
      - ${SAFELINE_DIR}/resources/sock:/app/sock
      - ${SAFELINE_DIR}/resources/chaos:/app/chaos
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.10
      safeline-database: {}
  npm-app:
    image: jc21/nginx-proxy-manager:2.16.0
    restart: unless-stopped
    ports:
      - "${ADMIN_BIND_IP:-127.0.0.1}:${NPM_ADMIN_PORT:-81}:81"
      # Host-network Tengine reaches this upstream through host loopback.
      - "127.0.0.1:8080:80"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    environment:
      TZ: Asia/Bangkok
      DB_MYSQL_HOST: npm-db
      DB_MYSQL_PORT: "3306"
      DB_MYSQL_USER: npm
      DB_MYSQL_PASSWORD: ${NPM_DB_PASSWORD:?NPM_DB_PASSWORD required}
      DB_MYSQL_NAME: npm
    depends_on:
      npm-db:
        condition: service_healthy
      test-route-init:
        condition: service_completed_successfully
        required: false
    logging: *default-logging
    networks:
      - npm-backend
      - npm-database

  npm-db:
    image: mariadb:10.11.14
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${NPM_DB_ROOT_PASSWORD:?NPM_DB_ROOT_PASSWORD required}
      MARIADB_DATABASE: npm
      MARIADB_USER: npm
      MARIADB_PASSWORD: ${NPM_DB_PASSWORD:?NPM_DB_PASSWORD required}
      TZ: Asia/Bangkok
    volumes:
      - ./npm/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *default-logging
    networks:
      - npm-database

  test-site:
    profiles: [test]
    image: python:3.13.9-alpine
    restart: unless-stopped
    command: ["python", "-B", "/app/server.py"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./test-site:/app:ro
    depends_on:
      test-route-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - npm-backend

  test-route-init:
    profiles: [test]
    image: python:3.13.9-alpine
    restart: "no"
    command: ["python", "-B", "/fixtures/init-route.py"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./test-site:/fixtures:ro
      - ./npm/data:/data
    logging: *default-logging
