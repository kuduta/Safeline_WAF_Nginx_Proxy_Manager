# Docker Desktop: bridge Tengine and publish only localhost HTTP.
services:
  tengine:
    network_mode: !reset null
    networks:
      - safeline-ce
      - npm-backend
    ports:
      - "127.0.0.1:80:80"
  waf-upstream-relay:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    # Preserve the saved SafeLine backend http://127.0.0.1:8080.
    network_mode: service:tengine
    volumes:
      - ./test-site/desktop-relay.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      tengine:
        condition: service_started
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
